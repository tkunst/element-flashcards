version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]
    commit-message:
      prefix: "build(deps)"
    groups:
      github-actions-all:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/tests"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]
    commit-message:
      prefix: "build(deps)"
