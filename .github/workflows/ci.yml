name: ci

# Every push/PR: the shared site guard (no em-dashes, no outside
# fonts/scripts/images, only the published contact address, AP trademark
# notice, back-link to the hub, page basics) and a headless-browser smoke test
# that runs the flashcards, schedule, game, and backup on laptop and phone screen sizes.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 scripts/site_guard.py

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - run: python3 tests/smoke_test.py
